<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Booking API — Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    .intro {
      background: #0b2545; color: #fff; padding: 20px 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .intro h1 { margin: 0 0 6px; font-size: 20px; }
    .intro p { margin: 0; opacity: .85; font-size: 14px; }
    .intro code { background: rgba(255,255,255,.15); padding: 1px 6px; border-radius: 4px; }
    #swagger-ui { max-width: 1100px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="intro">
    <h1>✈️ Flight Booking Voice Agent — API Explorer</h1>
    <p>All 8 endpoints, live against Supabase. Auth is pre-wired — open an endpoint, click <b>Try it out</b> → <b>Execute</b>. Demo booking: <code>NS7K2Q</code> · route <code>OSL → LHR</code> · date <code>2026-10-01</code>.</p>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    // Publishable key — safe for the browser (Row Level Security protects the tables).
    const PUBLISHABLE_KEY = "sb_publishable_SNafVoNYzjtRzby3l2R2oA_0KEXqBWW";
    window.ui = SwaggerUIBundle({
      url: "./openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      tryItOutEnabled: true,
      defaultModelsExpandDepth: -1,
      presets: [SwaggerUIBundle.presets.apis],
      onComplete: function () {
        // Pre-authorize both required headers so "Execute" works with no setup.
        window.ui.preauthorizeApiKey("apikey", PUBLISHABLE_KEY);
        window.ui.preauthorizeApiKey("authorization", "Bearer " + PUBLISHABLE_KEY);
      }
    });
  </script>
</body>
</html>
